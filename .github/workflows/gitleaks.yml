name: Secret scan (gitleaks)

# Centralized secret scanning — the safety net that cannot be bypassed with
# `git commit --no-verify`. Runs on every PR and on pushes to protected branches.
# A leaked credential (API key, client_secret, token, private key) fails the check.

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pushes are scanned across their commit range, not just the tip.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
