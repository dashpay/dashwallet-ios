name: Release dashpay to TestFlight

run-name: >-
  dashpay ${{ inputs.release_channel }} TestFlight from ${{ inputs.wallet_ref }}
  → ${{ inputs.app_version }} (platform ${{ inputs.platform_ref }})

on:
  workflow_dispatch:
    inputs:
      wallet_ref:
        description: "dashwallet-ios branch, tag, or commit SHA"
        required: true
        default: develop
        type: string
      platform_ref:
        description: "dashpay/platform branch, tag, or commit SHA"
        required: true
        default: v4.2-dev
        type: string
      dashuikit_ref:
        description: "dashpay/DashUIKit branch, tag, or commit SHA — blank uses the pin committed in Package.resolved"
        required: false
        default: ""
        type: string
      release_channel:
        description: "TestFlight distribution channel"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
      app_version:
        description: "App version, or 'auto' to follow the latest TestFlight/App Store version"
        required: true
        default: auto
        type: string
      testflight_group:
        description: "Exact external TestFlight group name (ignored for internal releases)"
        required: true
        default: Public Beta v9.0
        type: string
      what_to_test:
        description: "TestFlight 'What to Test' notes"
        required: true
        default: "New beta build."
        type: string

permissions:
  contents: read

concurrency:
  group: dashpay-testflight
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload dashpay
    runs-on: macos-26
    timeout-minutes: 300
    environment: testflight
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/dashwallet-ios

    env:
      APPLE_TEAM_ID: 44RJ69WHFF
      DASHPAY_BUNDLE_ID: org.dashfoundation.dash
      FASTLANE_VERSION: "2.232.2"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      # The wallet uses ../platform/packages/swift-sdk as a local Swift
      # package, so both repositories must be siblings in the Actions
      # workspace.
      - name: Checkout dashwallet-ios
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.wallet_ref }}
          path: dashwallet-ios
          fetch-depth: 1
          persist-credentials: false

      # DashUIKit is a remote Swift package, so a branch of it cannot be tested
      # by checking it out beside the wallet the way platform is. The archive
      # runs with `-onlyUsePackageVersionsFromResolvedFile`, which makes
      # `Package.resolved` the authority — so pointing that (and the project's
      # branch requirement, which must agree) at another ref is what selects it.
      #
      # Left blank, nothing is touched and the committed pin is used.
      - name: Override the DashUIKit pin
        if: inputs.dashuikit_ref != ''
        working-directory: ${{ github.workspace }}/dashwallet-ios
        env:
          DASHUIKIT_REF: ${{ inputs.dashuikit_ref }}
        run: |
          set -euo pipefail

          # A branch or tag resolves to its tip; anything else is taken as a
          # commit SHA already, and `Package.resolved` wants both a name and a
          # revision either way.
          sha="$(git ls-remote https://github.com/dashpay/DashUIKit "$DASHUIKIT_REF" | cut -f1 | head -1)"
          if [ -z "$sha" ]; then
            sha="$DASHUIKIT_REF"
          fi
          echo "DashUIKit → $DASHUIKIT_REF ($sha)"

          python3 - "$DASHUIKIT_REF" "$sha" <<'PY'
          import json, re, sys

          ref, sha = sys.argv[1], sys.argv[2]

          resolved = "DashWallet.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          with open(resolved) as handle:
              document = json.load(handle)
          pins = [p for p in document["pins"] if p["identity"].lower() == "dashuikit"]
          if not pins:
              sys.exit("no DashUIKit pin in Package.resolved")
          pins[0]["state"] = {"branch": ref, "revision": sha}
          with open(resolved, "w") as handle:
              json.dump(document, handle, indent=2)
              handle.write("\n")

          # The project pins a branch too, and `-onlyUsePackageVersionsFromResolvedFile`
          # still checks the resolved revision against it. Rewrites only the
          # requirement inside DashUIKit's own reference block.
          project = "DashWallet.xcodeproj/project.pbxproj"
          with open(project) as handle:
              text = handle.read()
          pattern = re.compile(
              r'(XCRemoteSwiftPackageReference "DashUIKit" \*/ = \{.*?branch = )[^;]+(;)',
              re.DOTALL)
          # Quoted: a branch name carries slashes, and pbxproj only leaves bare
          # tokens unquoted. Quoting a plain name too is harmless.
          text, count = pattern.subn(rf'\g<1>"{ref}"\g<2>', text, count=1)
          if count != 1:
              sys.exit("could not rewrite the DashUIKit branch requirement")
          with open(project, "w") as handle:
              handle.write(text)
          PY

      # The release scripts come from the ref this workflow was dispatched
      # from, not from the branch being built. Every step runs inside the
      # `dashwallet-ios` checkout, so `.github/scripts` there is whatever
      # `wallet_ref` happens to carry — and a branch cut before those scripts
      # existed cannot be released at all, which is the opposite of what a
      # release pipeline is for. Sparse: only the scripts are needed.
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: release-tooling
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Locate release tooling
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/release-tooling/.github/scripts/app_store_connect_release.rb"
          if [[ ! -f "$script" ]]; then
            echo "::error::release tooling missing at $script"
            exit 1
          fi
          echo "RELEASE_SCRIPT=$script" >> "$GITHUB_ENV"

      - name: Checkout platform
        uses: actions/checkout@v6
        with:
          repository: dashpay/platform
          ref: ${{ inputs.platform_ref }}
          path: platform
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve archive paths
        run: |
          set -euo pipefail
          echo "ARCHIVE_PATH=$RUNNER_TEMP/dashpay.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/dashpay-export" >> "$GITHUB_ENV"

      - name: Validate release secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          COINBASE_INFO_PLIST_BASE64: ${{ secrets.COINBASE_INFO_PLIST_BASE64 }}
          TOPPER_INFO_PLIST_BASE64: ${{ secrets.TOPPER_INFO_PLIST_BASE64 }}
          ZENLEDGER_INFO_PLIST_BASE64: ${{ secrets.ZENLEDGER_INFO_PLIST_BASE64 }}
          UPHOLD_INFO_PLIST_BASE64: ${{ secrets.UPHOLD_INFO_PLIST_BASE64 }}
          SWAPKIT_INFO_PLIST_BASE64: ${{ secrets.SWAPKIT_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail

          required_secrets=(
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64
            GOOGLE_SERVICE_INFO_PLIST_BASE64
            COINBASE_INFO_PLIST_BASE64
            TOPPER_INFO_PLIST_BASE64
            ZENLEDGER_INFO_PLIST_BASE64
            UPHOLD_INFO_PLIST_BASE64
            SWAPKIT_INFO_PLIST_BASE64
          )

          missing=0
          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done

          # The development certificate pair is optional, but must be set
          # together. Without it, automatic signing mints a brand-new Apple
          # Development certificate on every run (the runner keychain is
          # ephemeral) until the team hits Apple's certificate limit and
          # archiving fails with "Choose a certificate to revoke".
          if [[ -n "${APPLE_DEVELOPMENT_CERTIFICATE_BASE64:-}" && -z "${APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "::error::APPLE_DEVELOPMENT_CERTIFICATE_BASE64 is set but APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD is missing."
            missing=1
          fi
          if [[ -z "${APPLE_DEVELOPMENT_CERTIFICATE_BASE64:-}" && -n "${APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "::error::APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD is set but APPLE_DEVELOPMENT_CERTIFICATE_BASE64 is missing."
            missing=1
          fi
          if [[ -z "${APPLE_DEVELOPMENT_CERTIFICATE_BASE64:-}" ]]; then
            echo "::warning::APPLE_DEVELOPMENT_CERTIFICATE_BASE64 is not set. Automatic signing will create a new Apple Development certificate for this run, which eventually exhausts the team's certificate quota."
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Resolve build provenance
        id: release-info
        run: |
          set -euo pipefail

          wallet_sha=$(git rev-parse HEAD)
          platform_sha=$(git -C ../platform rev-parse HEAD)

          {
            echo "wallet_sha=$wallet_sha"
            echo "platform_sha=$platform_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        env:
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode -o "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

          fastlane_api_key_path="$RUNNER_TEMP/app-store-connect-api-key.json"
          FASTLANE_API_KEY_PATH="$fastlane_api_key_path" \
          APP_STORE_CONNECT_API_KEY_PATH="$api_key_path" \
          API_KEY_ID="$API_KEY_ID" \
          API_ISSUER_ID="$API_ISSUER_ID" \
          ruby -rjson -e '
            File.write(
              ENV.fetch("FASTLANE_API_KEY_PATH"),
              JSON.generate(
                key_id: ENV.fetch("API_KEY_ID"),
                issuer_id: ENV.fetch("API_ISSUER_ID"),
                key: File.read(ENV.fetch("APP_STORE_CONNECT_API_KEY_PATH")),
                duration: 1200,
                in_house: false
              )
            )
          '
          chmod 600 "$fastlane_api_key_path"
          echo "FASTLANE_API_KEY_PATH=$fastlane_api_key_path" >> "$GITHUB_ENV"

      - name: Resolve TestFlight release version
        id: release-version
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ env.DASHPAY_BUNDLE_ID }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          REQUESTED_VERSION: ${{ inputs.app_version }}
          TESTFLIGHT_GROUP: ${{ inputs.testflight_group }}
        run: |
          set -euo pipefail
          ruby "$RELEASE_SCRIPT" resolve-version

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Restore release XCFramework cache
        id: xcframework-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/platform/packages/swift-sdk/DashSDKFFI.xcframework
          key: dash-sdk-xcframework-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-rust-1.92-ios-sim-release-${{ steps.release-info.outputs.platform_sha }}

      - name: Set up Rust 1.92
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Ensure iOS Rust targets for platform toolchain
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/platform
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Restore Cargo dependencies cache
        id: cargo-cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: swift-sdk-cargo-${{ runner.os }}-${{ hashFiles('platform/Cargo.lock') }}
          restore-keys: |
            swift-sdk-cargo-${{ runner.os }}-

      - name: Install protoc
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "32.x"
          repo-token: ${{ github.token }}

      - name: Build release XCFramework from platform
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/platform/packages/swift-sdk
        env:
          PRUNE_CARGO_TARGETS: "1"
          SKIP_EXAMPLE_APP_BUILD: "1"
        run: |
          set -euo pipefail
          ./build_ios.sh --target ios --target sim --profile release
          test -d DashSDKFFI.xcframework

      - name: Save Cargo dependencies cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save release XCFramework cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/platform/packages/swift-sdk/DashSDKFFI.xcframework
          key: ${{ steps.xcframework-cache.outputs.cache-primary-key }}

      - name: Verify release XCFramework
        run: test -d ../platform/packages/swift-sdk/DashSDKFFI.xcframework

      - name: Set up CocoaPods 1.15.2
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: "1.15.2"

      - name: Restore CocoaPods dependencies cache
        id: cocoapods-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ github.workspace }}/dashwallet-ios/Pods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-1.15.2-${{ hashFiles('dashwallet-ios/Podfile.lock') }}

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          pod _1.15.2_ install --deployment

      - name: Save CocoaPods dependencies cache
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ github.workspace }}/dashwallet-ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Restore private app configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          COINBASE_INFO_PLIST_BASE64: ${{ secrets.COINBASE_INFO_PLIST_BASE64 }}
          TOPPER_INFO_PLIST_BASE64: ${{ secrets.TOPPER_INFO_PLIST_BASE64 }}
          ZENLEDGER_INFO_PLIST_BASE64: ${{ secrets.ZENLEDGER_INFO_PLIST_BASE64 }}
          UPHOLD_INFO_PLIST_BASE64: ${{ secrets.UPHOLD_INFO_PLIST_BASE64 }}
          SWAPKIT_INFO_PLIST_BASE64: ${{ secrets.SWAPKIT_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/GoogleService-Info.plist
          printf '%s' "$COINBASE_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/Coinbase-Info.plist
          printf '%s' "$TOPPER_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/Topper-Info.plist
          printf '%s' "$ZENLEDGER_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/ZenLedger-Info.plist
          printf '%s' "$UPHOLD_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/Uphold-Info.plist
          printf '%s' "$SWAPKIT_INFO_PLIST_BASE64" | base64 --decode -o DashWallet/SwapKit-Info.plist

          plutil -lint \
            DashWallet/GoogleService-Info.plist \
            DashWallet/Coinbase-Info.plist \
            DashWallet/Topper-Info.plist \
            DashWallet/ZenLedger-Info.plist \
            DashWallet/Uphold-Info.plist \
            DashWallet/SwapKit-Info.plist

      - name: Resolve next TestFlight build number
        id: release-build
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ env.DASHPAY_BUNDLE_ID }}
          EFFECTIVE_VERSION: ${{ steps.release-version.outputs.effective_version }}
        run: |
          set -euo pipefail
          ruby "$RELEASE_SCRIPT" resolve-build

      - name: Install Apple signing certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          original_keychains_path="$RUNNER_TEMP/original-user-keychains.txt"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security list-keychains -d user > "$original_keychains_path"
          original_default_keychain=$(security default-keychain -d user)
          original_default_keychain="${original_default_keychain#"${original_default_keychain%%[![:space:]]*}"}"
          original_default_keychain="${original_default_keychain#\"}"
          original_default_keychain="${original_default_keychain%\"}"

          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"
          echo "ORIGINAL_KEYCHAINS_PATH=$original_keychains_path" >> "$GITHUB_ENV"

          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -n "$keychain" ]] && existing_keychains+=("$keychain")
          done < "$original_keychains_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"

          # A persistent development certificate lets automatic signing sign
          # the archive without minting a new Apple Development certificate
          # on every run.
          if [[ -n "${DEVELOPMENT_CERTIFICATE_BASE64:-}" ]]; then
            development_certificate_path="$RUNNER_TEMP/apple-development.p12"
            printf '%s' "$DEVELOPMENT_CERTIFICATE_BASE64" | base64 --decode -o "$development_certificate_path"
            security import "$development_certificate_path" \
              -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -t cert \
              -f pkcs12 \
              -k "$keychain_path"
            rm -f "$development_certificate_path"
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path"

          rm -f "$certificate_path"

      - name: Archive dashpay
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          EFFECTIVE_VERSION: ${{ steps.release-version.outputs.effective_version }}
          BUILD_NUMBER: ${{ steps.release-build.outputs.build_number }}
        run: |
          set -euo pipefail

          xcodebuild archive \
            -workspace DashWallet.xcworkspace \
            -scheme dashpay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$EFFECTIVE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Read archived app version
        id: app-version
        env:
          EXPECTED_BUNDLE_ID: ${{ env.DASHPAY_BUNDLE_ID }}
          EXPECTED_VERSION: ${{ steps.release-version.outputs.effective_version }}
          EXPECTED_BUILD: ${{ steps.release-build.outputs.build_number }}
        run: |
          set -euo pipefail

          app_path=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "::error::The archive does not contain an app bundle."
            exit 1
          fi

          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")

          if [[ "$bundle_id" != "$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error::Archived bundle ID '$bundle_id' does not match expected '$EXPECTED_BUNDLE_ID'."
            exit 1
          fi
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Archived version '$version' does not match planned version '$EXPECTED_VERSION'."
            exit 1
          fi
          if [[ "$build" != "$EXPECTED_BUILD" ]]; then
            echo "::error::Archived build '$build' does not match planned build '$EXPECTED_BUILD'."
            exit 1
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "bundle_id=$bundle_id"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure fastlane is available
        run: |
          set -euo pipefail

          fastlane_gem_home="$RUNNER_TEMP/fastlane-gems"
          gem install fastlane \
            --version "$FASTLANE_VERSION" \
            --install-dir "$fastlane_gem_home" \
            --no-document

          echo "FASTLANE_BIN=$fastlane_gem_home/bin/fastlane" >> "$GITHUB_ENV"
          echo "GEM_HOME=$fastlane_gem_home" >> "$GITHUB_ENV"
          echo "GEM_PATH=$fastlane_gem_home" >> "$GITHUB_ENV"
          echo "$fastlane_gem_home/bin" >> "$GITHUB_PATH"

          fastlane_ruby=$(sed -n '1s/^#!//p' "$fastlane_gem_home/bin/fastlane")
          if [[ ! -x "$fastlane_ruby" ]]; then
            echo "::error::Unable to resolve the Ruby interpreter used by fastlane."
            exit 1
          fi
          echo "FASTLANE_RUBY=$fastlane_ruby" >> "$GITHUB_ENV"

          GEM_HOME="$fastlane_gem_home" \
          GEM_PATH="$fastlane_gem_home" \
            "$fastlane_gem_home/bin/fastlane" "_${FASTLANE_VERSION}_" --version

      - name: Verify TestFlight build number is still available
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.app-version.outputs.bundle_id }}
          EFFECTIVE_VERSION: ${{ steps.app-version.outputs.version }}
          BUILD_NUMBER: ${{ steps.app-version.outputs.build }}
        run: |
          set -euo pipefail
          ruby "$RELEASE_SCRIPT" assert-build-free

      - name: Upload archive to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          export_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Wait for uploaded TestFlight build
        id: uploaded-build
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.app-version.outputs.bundle_id }}
          EFFECTIVE_VERSION: ${{ steps.app-version.outputs.version }}
          BUILD_NUMBER: ${{ steps.app-version.outputs.build }}
        run: |
          set -euo pipefail
          ruby "$RELEASE_SCRIPT" wait-build

      - name: Finalize internal TestFlight build
        if: inputs.release_channel == 'internal'
        env:
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          VERSION: ${{ steps.app-version.outputs.version }}
          BUILD: ${{ steps.uploaded-build.outputs.number }}
          BUNDLE_ID: ${{ steps.app-version.outputs.bundle_id }}
        run: |
          set -euo pipefail

          "$FASTLANE_BIN" "_${FASTLANE_VERSION}_" run upload_to_testflight \
            api_key_path:"$FASTLANE_API_KEY_PATH" \
            app_identifier:"$BUNDLE_ID" \
            app_platform:ios \
            app_version:"$VERSION" \
            build_number:"$BUILD" \
            distribute_only:true \
            distribute_external:false \
            notify_external_testers:false \
            submit_beta_review:false \
            changelog:"$WHAT_TO_TEST" \
            wait_processing_interval:30 \
            wait_processing_timeout_duration:7200

      - name: Distribute build to external TestFlight group
        if: inputs.release_channel == 'external'
        env:
          TESTFLIGHT_GROUP: ${{ inputs.testflight_group }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          VERSION: ${{ steps.app-version.outputs.version }}
          BUILD: ${{ steps.uploaded-build.outputs.number }}
          BUNDLE_ID: ${{ steps.app-version.outputs.bundle_id }}
        run: |
          set -euo pipefail

          "$FASTLANE_BIN" "_${FASTLANE_VERSION}_" run upload_to_testflight \
            api_key_path:"$FASTLANE_API_KEY_PATH" \
            app_identifier:"$BUNDLE_ID" \
            app_platform:ios \
            app_version:"$VERSION" \
            build_number:"$BUILD" \
            distribute_only:true \
            groups:"$TESTFLIGHT_GROUP" \
            distribute_external:true \
            notify_external_testers:true \
            submit_beta_review:true \
            changelog:"$WHAT_TO_TEST" \
            wait_processing_interval:30 \
            wait_processing_timeout_duration:7200

      - name: Write release summary
        env:
          WALLET_SHA: ${{ steps.release-info.outputs.wallet_sha }}
          PLATFORM_SHA: ${{ steps.release-info.outputs.platform_sha }}
          REQUESTED_WALLET_REF: ${{ inputs.wallet_ref }}
          REQUESTED_PLATFORM_REF: ${{ inputs.platform_ref }}
          REQUESTED_VERSION: ${{ steps.release-version.outputs.requested_version }}
          LATEST_TESTFLIGHT_VERSION: ${{ steps.release-version.outputs.latest_testflight_version }}
          LATEST_PRODUCTION_VERSION: ${{ steps.release-version.outputs.latest_production_version }}
          VERSION: ${{ steps.app-version.outputs.version }}
          BUILD: ${{ steps.uploaded-build.outputs.number }}
          BUNDLE_ID: ${{ steps.app-version.outputs.bundle_id }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          TESTFLIGHT_GROUP: ${{ inputs.testflight_group }}
        run: |
          {
            echo '## dashpay uploaded to TestFlight'
            echo
            echo "- App: ${VERSION} (${BUILD})"
            echo "- Requested version: \`${REQUESTED_VERSION}\`"
            echo "- Latest TestFlight version: \`${LATEST_TESTFLIGHT_VERSION}\`"
            echo "- Latest production version: \`${LATEST_PRODUCTION_VERSION}\`"
            echo "- Bundle ID: \`${BUNDLE_ID}\`"
            echo "- dashwallet-ios: \`${WALLET_SHA}\` (requested: \`${REQUESTED_WALLET_REF}\`)"
            echo "- platform: \`${PLATFORM_SHA}\` (requested: \`${REQUESTED_PLATFORM_REF}\`)"
            echo "- Channel: \`${RELEASE_CHANNEL}\`"
            if [[ "$RELEASE_CHANNEL" == 'internal' ]]; then
              echo '- Internal group: `App Store Connect Users`'
              echo '- External distribution: disabled'
              echo '- Beta App Review: not submitted'
            else
              echo "- External group: \`${TESTFLIGHT_GROUP}\`"
              echo '- External tester notifications: enabled'
            fi
            echo
            echo 'The uploaded build is processed and ready for TestFlight.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          set -uo pipefail

          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi

          if [[ -n "${ORIGINAL_KEYCHAINS_PATH:-}" && -f "$ORIGINAL_KEYCHAINS_PATH" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              keychain="${keychain#"${keychain%%[![:space:]]*}"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$ORIGINAL_KEYCHAINS_PATH"
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}" || true
            fi
          fi

          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "${APP_STORE_CONNECT_API_KEY_PATH:-}" \
            "${FASTLANE_API_KEY_PATH:-}" \
            "${ORIGINAL_KEYCHAINS_PATH:-}" \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/apple-development.p12" \
            DashWallet/GoogleService-Info.plist \
            DashWallet/Coinbase-Info.plist \
            DashWallet/Topper-Info.plist \
            DashWallet/ZenLedger-Info.plist \
            DashWallet/Uphold-Info.plist \
            DashWallet/SwapKit-Info.plist
