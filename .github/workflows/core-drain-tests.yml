name: Core Shielded Max recovery

on:
  pull_request:
    paths:
      - 'DashWallet/Sources/UI/Payments/**'
      - 'DashWallet/Sources/UI/Home/Views/CoinJoinMoveFunds/CoinJoinMoveFundsViewModel.swift'
      - 'DashWallet/Sources/UI/DashPay/Profile/SDKIdentityProfileSheet.swift'
      - 'DashWallet/Sources/Infrastructure/SwiftDashSDK/**'
      - 'DashWalletTests/CoreShieldedDrainStoreTests.swift'
      - 'scripts/test_core_drain.py'
      - 'scripts/core_drain_recovery_harness.py'
      - 'scripts/test_platform_preparation.py'
      - 'scripts/test_asset_lock_recovery.py'
      - 'scripts/test_identity_top_up_compatibility.py'
      - 'scripts/test_internal_transfer_confirmation.py'
      - 'scripts/test_core_to_shielded_fee_cache.py'
      - 'scripts/fixtures/**'
      - '.github/workflows/core-drain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test durable markers and form recovery
        run: python3 scripts/test_core_drain.py
      - name: Test preparation and transfer recovery
        run: |
          python3 scripts/test_platform_preparation.py
          python3 scripts/test_asset_lock_recovery.py
          python3 scripts/test_identity_top_up_compatibility.py
          python3 scripts/test_internal_transfer_confirmation.py
          python3 scripts/test_core_to_shielded_fee_cache.py
