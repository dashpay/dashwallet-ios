name: Schema release tooling tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/*schema*'
      - '.github/workflows/release-dashpay-testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -I.github/scripts -e 'Dir[".github/scripts/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
