name: Schema release tooling tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/*schema*'
      - '.github/workflows/release-dashpay-testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      - run: ruby -I.github/scripts -e 'Dir[".github/scripts/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
